 return `${ph(type=='job'?'Find jobs':'Internships',type=='job'?'Full-time roles for graduating students and recent graduates.':'Build real experience with paid and project-based internships.')}<div class="wrap"><form class="filters" data-f="flt" data-t="${type}"><input name="q" placeholder="Title, skill or company" value="${esc(q.q)}" aria-label="Search"><input name="l" placeholder="Location" value="${esc(q.l)}" aria-label="Location"><select name="s" aria-label="Sort"><option value="n">Newest first</option><option value="deadline" ${q.s=='deadline'?'selected':''}>Deadline soonest</option></select><button class="btn">Apply filters</button></form>${l.length?`<div class="list">${l.map(j=>card(j,me()&&db.saved.some(s=>s.u==me().id&&s.j==j.id))).join('')}</div>`:'<p>No matches. Try a different skill or clear the location.</p>'}</div>`},
'/companies'(){return `${ph('Companies hiring on TalentBridge','Every employer is registered and reviewed before posting.')}<div class="wrap"><div class="g3">${db.users.filter(u=>u.role=='company'&&u.status!='blocked').map(c=>`<div class="card"><div class="row"><span class="av">${esc(ini(c.name))}</span><h3>${esc(c.name)}</h3></div><p>${esc(c.description)}</p>${c.website?`<a href="${esc(c.website)}" target="_blank" rel="noreferrer">Visit website</a>`:''}</div>`).join('')}</div></div>`},
'/about'(){return `${ph('About TalentBridge','Where student talent meets industry opportunity.')}<div class="wrap narrow"><p class="big">TalentBridge is designed to bridge the gap between student talent and industry opportunities. Our platform helps students discover internships and jobs while allowing companies to connect with skilled future professionals.</p></div><div class="wrap" style="padding-top:0"><div class="g2"><div><h2>For students</h2><div class="s"><h3>Build one profile</h3><p>Add your degree, skills and resume once.</p></div><div class="s"><h3>Apply in a click</h3><p>Search by skill or location and apply to jobs and internships.</p></div><div class="s"><h3>Track every application</h3><p>See Pending, Shortlisted, Rejected or Selected, with a notification for each change.</p></div></div><div><h2>For companies</h2><div class="s"><h3>Register and post</h3><p>Publish vacancies and internships. Admins review them before they go live.</p></div><div class="s"><h3>Review real profiles</h3><p>Read each student’s profile and download their resume.</p></div><div class="s"><h3>Shortlist with confidence</h3><p>Update statuses and students are told straight away.</p></div></div></div></div>`},
'/contact'(){return `${ph('Contact us','Questions about the platform? We reply within two working days.')}<div class="wrap g2"><div><h3>Email</h3><p>hello@talentbridge.example</p><h3>Phone</h3><p>+91 00000 00000</p><h3>Office</h3><p>Your City, Country</p></div><form class="card f" data-f="contact">${F('Name','name',{req:1})}${F('Email','email',{t:'email',req:1})}${F('Subject','subject')}${F('Message','message',{ta:1,req:1})}<button class="btn">Send message</button></form></div>`},
'/login'(){return `<div class="ap">${side('Welcome back','Pick up your applications where you left off.')}<form class="card f" data-f="login"><h1>Log in</h1>${F('Email','email',{t:'email',req:1})}${F('Password','pw',{t:'password',req:1})}<button class="btn">Log in</button><p class="hint">Demo: admin@talentbridge.com / Admin@123 · nimbus@demo.com / Demo@123</p><p>New here? <a href="#/signup">Create a student account</a> or <a href="#/company/register">register a company</a>.</p></form></div>`},
'/signup'(){return reg('student')},'/company/register'(){return reg('company')},
'/student'(){const u=me();if(u?.role!='student')return go('/login');const ap=db.apps.filter(a=>a.s==u.id),sv=db.jobs.filter(j=>db.saved.some(s=>s.u==u.id&&s.j==j.id)),nt=db.notes.filter(n=>n.u==u.id).reverse().slice(0,8);
 return `<div class="wrap"><h1>Welcome, ${esc(u.name)}</h1><div class="g2"><section class="card"><h3>Your profile</h3><p>Student ID: <b>${u.pid}</b><br>${esc(u.degree)} · ${esc(u.college)} · ${esc(u.grad)}<br>Skills: ${esc(u.skills)}<br>Resume: ${u.resume?esc(u.resume.name)+' ✓':'not uploaded yet'}</p><label class="btn gh" style="display:inline-block">Upload resume (PDF/Word)<input hidden type="file" id="rs" accept=".pdf,.doc,.docx"></label> <button class="btn" data-a="editme">Edit profile</button></section><section class="card"><h3>Notifications</h3>${nt.length?'<ul>'+nt.map(n=>`<li>${esc(n.m)}</li>`).join('')+'</ul>':'<p>No notifications yet.</p>'}</section></div>
 ${editMe?`<form class="card f" data-f="prof"><h3>Edit profile</h3>${F('Full name','name',{v:u.name,req:1})}${F('Phone','phone',{v:u.phone})}${F('College','college',{v:u.college})}${F('Degree and department','degree',{v:u.degree})}${F('Graduation year','grad',{v:u.grad,t:'number'})}${F('Skills','skills',{v:u.skills})}<button class="btn">Save changes</button></form>`:''}
 <h2>Applied (${ap.length})</h2>${ap.length?`<div class="sc"><table><tr><th>Role</th><th>Company</th><th>Status</th></tr>${ap.map(a=>{const j=db.jobs.find(j=>j.id==a.j)||{};return `<tr><td>${esc(j.title)}</td><td>${esc(co(j))}</td><td>${status(a.st)}</td></tr>`}).join('')}</table></div>`:'<p>You haven’t applied yet. <a href="#/jobs">Find jobs</a> or <a href="#/internships">browse internships</a>.</p>'}
 <h2>Saved (${sv.length})</h2><div class="list">${sv.map(j=>card(j,1)).join('')}</div></div>`},
'/company'(){const u=me();if(u?.role!='company')return go('/login');const jb=db.jobs.filter(j=>j.cid==u.id),e=editJob?jb.find(j=>j.id==editJob)||{}:{},ap=db.apps.filter(a=>jb.some(j=>j.id==a.j));
 return `<div class="wrap"><h1>${esc(u.name)} dashboard</h1><p>Company ID: <b>${u.pid}</b></p><form class="card f" data-f="job"><h3>${editJob?'Edit posting':'Post a job or internship'}</h3><label>Type<select name="type"><option value="job">Job</option><option value="internship" ${e.type=='internship'?'selected':''}>Internship</option></select></label>${F('Title','title',{v:e.title,req:1})}${F('Location','location',{v:e.location})}${F('Required skills','skills',{v:e.skills})}${F('Eligibility','eligibility',{v:e.eligibility})}${F('Salary / stipend','salary',{v:e.salary})}${F('Application deadline','deadline',{t:'date',v:e.deadline})}${F('Description','description',{ta:1,req:1,v:e.description})}<div class="row gap"><button class="btn">${editJob?'Save changes':'Publish posting'}</button>${editJob?'<button type="button" class="btn gh" data-a="cancel">Cancel</button>':''}</div></form>
 <h2>Your postings</h2><div class="sc"><table><tr><th>Title</th><th>Type</th><th>Live?</th><th></th></tr>${jb.map(j=>`<tr><td>${esc(j.title)}</td><td>${j.type}</td><td>${j.approved?'Live':'Awaiting admin approval'}</td><td><button class="btn gh sm" data-a="ej" data-i="${j.id}">Edit</button> <button class="btn gh sm" data-a="dj" data-i="${j.id}">Delete</button></td></tr>`).join('')}</table></div>
 <h2>Applications</h2>${ap.length?`<div class="sc"><table><tr><th>Student</th><th>Role</th><th>Profile</th><th>Status</th></tr>${ap.map(a=>{const s=db.users.find(x=>x.id==a.s),j=jb.find(j=>j.id==a.j);return `<tr><td>${esc(s.name)}<br><small>${s.pid}</small></td><td>${esc(j.title)}</td><td><small>${esc(s.degree)}, ${esc(s.college)} (${esc(s.grad)})<br>${esc(s.skills)}<br>${esc(s.email)}</small><br>${s.resume?`<a href="${s.resume.data}" download="${esc(s.resume.name)}">Download resume</a>`:''}</td><td>${status(a.st)}<br><select data-a="st" data-i="${a.id}" aria-label="Update status">${['Pending','Shortlisted','Rejected','Selected'].map(x=>`<option ${x==a.st?'selected':''}>${x}</option>`).join('')}</select></td></tr>`}).join('')}</table></div>`:'<p>No applications yet.</p>'}</div>`},
'/admin'(){if(me()?.role!='admin')return go('/login');const s={students:db.users.filter(u=>u.role=='student').length,companies:db.users.filter(u=>u.role=='company').length,jobs:db.jobs.filter(j=>j.type=='job').length,internships:db.jobs.filter(j=>j.type=='internship').length,applications:db.apps.length},mx=Math.max(1,...Object.values(s));
 return `<div class="wrap"><h1>Admin dashboard</h1><div class="stats">${Object.entries(s).map(([k,v])=>`<div><b>${v}</b><span>${k}</span></div>`).join('')}</div><section class="card" style="margin-top:18px"><h3>Platform overview</h3>${Object.entries(s).map(([k,v])=>`<div class="bar"><span>${k}</span><i style="width:${v/mx*100}%">${v}</i></div>`).join('')}</section>
 <h2>Accounts</h2><div class="sc"><table><tr><th>ID</th><th>Name</th><th>Role</th><th>Status</th><th></th></tr>${db.users.filter(u=>u.role!='admin').map(u=>`<tr><td>${u.pid}</td><td>${esc(u.name)}<br><small>${esc(u.email)}</small></td><td>${u.role}</td><td>${u.status||'active'}</td><td><button class="btn gh sm" data-a="blk" data-i="${u.id}">${u.status=='blocked'?'Unblock':'Block'}</button> <button class="btn gh sm" data-a="du" data-i="${u.id}">Remove</button></td></tr>`).join('')}</table></div>
 <h2>Postings</h2><div class="sc"><table><tr><th>Title</th><th>Company</th><th>Type</th><th></th></tr>${db.jobs.map(j=>`<tr><td>${esc(j.title)}</td><td>${esc(co(j))}</td><td>${j.type}</td><td><button class="btn gh sm" data-a="ap" data-i="${j.id}">${j.approved?'Unpublish':'Approve'}</button> <button class="btn gh sm" data-a="dj" data-i="${j.id}">Remove</button></td></tr>`).join('')}</table></div>
 <h2>Applications</h2><div class="sc"><table><tr><th>Student</th><th>Role</th><th>Status</th></tr>${db.apps.map(a=>`<tr><td>${esc(db.users.find(u=>u.id==a.s)?.name)}</td><td>${esc(db.jobs.find(j=>j.id==a.j)?.title)}</td><td>${status(a.st)}</td></tr>`).join('')}</table></div></div>`}};
function reg(r){const s=r=='student';return `<div class="ap">${side(s?'Start your career here':'Hire emerging talent','Your '+(s?'Student':'Company')+' ID is created the moment you sign up.')}<form class="card f" data-f="reg" data-r="${r}"><h1>${s?'Create your student account':'Register your company'}</h1><p>Your ${s?'Student':'Company'} ID is generated automatically.</p>${F(s?'Full name':'Company name','name',{req:1})}${F(s?'Email address':'Company email','email',{t:'email',req:1})}${F(s?'Phone number':'Contact number','phone',{t:'tel',req:1,x:'pattern="[0-9+ \\-]{7,15}" title="7–15 digits"'})}${s?F('College name','college',{req:1})+F('Degree and department','degree',{req:1})+F('Graduation year','grad',{t:'number',req:1,x:'min=2020 max=2035'})+F('Skills (comma separated)','skills',{req:1}):F('Company website','website',{t:'url'})+F('Company description','description',{ta:1,req:1})}${F('Password (6+ characters)','pw',{t:'password',req:1,x:'minlength=6'})}<button class="btn">Create account</button></form></div>`}
function go(p){location.hash=p;return ''}
function route(){const [path,qs]=(location.hash.slice(1)||'/').split('?'),q=Object.fromEntries(new URLSearchParams(qs||'')),u=me();
 $('#nv').innerHTML=[['/','Home'],['/jobs','Find Jobs'],['/internships','Internships'],['/companies','Companies'],['/about','About Us'],['/contact','Contact']].map(([h,t])=>`<a href="#${h}" class="${path==h?'on':''}" onclick="nv.classList.remove('open')">${t}</a>`).join('')+(u?`<a class="btn gh" href="#/${u.role}">Dashboard</a><button class="btn" data-a="out">Log out</button>`:'<a class="btn gh" href="#/login">Login</a><a class="btn" href="#/signup">Sign up</a>');
 $('#app').innerHTML=path=='/jobs'?P.list('job',q):path=='/internships'?P.list('internship',q):(P[path]||P['/'])();document.title=($('#app h1')?.textContent||'Home')+' | TalentBridge';scrollTo(0,0)}
const H={
async hs(d){go(`/jobs?q=${encodeURIComponent(d.q)}&l=${encodeURIComponent(d.l)}`)},
async flt(d,f){go(`/${f.dataset.t=='job'?'jobs':'internships'}?q=${encodeURIComponent(d.q)}&l=${encodeURIComponent(d.l)}&s=${d.s}`)},
async contact(d){db.msgs.push(d);save();toast('Thanks! We will reply within two working days.');route()},
async login(d){const u=db.users.find(x=>x.email.toLowerCase()==d.email.toLowerCase());if(!u||u.pw!=await sha(d.pw))return toast('Email or password is incorrect',1);if(u.status=='blocked')return toast('This account has been blocked by an admin',1);localStorage.setItem('tb_me',u.id);toast('Welcome back, '+u.name);go('/'+u.role)},
async reg(d,f){if(d.pw.length<6)return toast('Password must be at least 6 characters',1);if(db.users.some(u=>u.email.toLowerCase()==d.email.toLowerCase()))return toast('This email is already registered',1);const r=f.dataset.r,pid=id(r=='student'?'STU':'CMP');db.users.push({...d,id:uid(),role:r,pid,pw:await sha(d.pw),status:'active'});save();toast('Account created. Your ID is '+pid+'. You can log in now.');go('/login')},
async prof(d){Object.assign(me(),d);editMe=false;save();toast('Profile saved');route()},
async job(d){const u=me();if(editJob){Object.assign(db.jobs.find(j=>j.id==editJob),d);toast('Posting updated')}else{db.jobs.push({...d,id:uid(),cid:u.id,approved:0});toast('Posted. It goes live once an admin approves it.')}editJob=null;save();route()}};
const A={
out(){localStorage.removeItem('tb_me');go('/');route()},editme(){editMe=true;route()},cancel(){editJob=null;route()},ej(e){editJob=+e.i;route();scrollTo(0,0)},
dj(e){if(!confirm('Remove this posting?'))return;db.jobs=db.jobs.filter(j=>j.id!=e.i);db.apps=db.apps.filter(a=>a.j!=e.i);save();route()},
du(e){if(!confirm('Remove this account and its data?'))return;db.users=db.users.filter(u=>u.id!=e.i);db.jobs=db.jobs.filter(j=>j.cid!=e.i);save();route()},
blk(e){const u=db.users.find(u=>u.id==e.i);u.status=u.status=='blocked'?'active':'blocked';save();route()},
ap(e){const j=db.jobs.find(j=>j.id==e.i);j.approved=j.approved?0:1;save();toast(j.approved?'Posting approved':'Posting unpublished');route()},
apply(e){const u=me();if(u?.role!='student')return go('/login');if(!u.resume)return toast('Upload your resume on your dashboard before applying',1);if(db.apps.some(a=>a.s==u.id&&a.j==e.i))return toast('You have already applied',1);db.apps.push({id:uid(),j:+e.i,s:u.id,st:'Pending'});db.notes.push({u:u.id,m:'Application submitted successfully'});save();toast('Application submitted')},
save(e){const u=me();if(u?.role!='student')return go('/login');const k=db.saved.findIndex(s=>s.u==u.id&&s.j==e.i);k<0?db.saved.push({u:u.id,j:+e.i}):db.saved.splice(k,1);save();toast(k<0?'Job saved':'Removed from saved');route()}};
document.addEventListener('submit',async e=>{const f=e.target.closest('form[data-f]');if(!f)return;e.preventDefault();await H[f.dataset.f](Object.fromEntries(new FormData(f)),f)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&b.tagName!='SELECT')A[b.dataset.a]?.(b.dataset)});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.a=='st'){const a=db.apps.find(a=>a.id==t.dataset.i),j=db.jobs.find(j=>j.id==a.j);a.st=t.value;db.notes.push({u:a.s,m:`Your application for ${j.title} is now ${t.value}`});save();toast('Status updated');route()}
 if(t.id=='rs'&&t.files[0]){const f=t.files[0];if(f.size>1.5e6)return toast('Choose a file under 1.5 MB',1);const r=new FileReader();r.onload=()=>{me().resume={name:f.name,data:r.result};save();toast('Resume uploaded');route()};r.readAsDataURL(f)}});
init();
</script></body></html>
